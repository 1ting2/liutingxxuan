<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>随机狗狗图片 - 刘庭轩</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
    background: #f4f5f7;
    color: #2c3e50;
    padding: 24px;
    min-height: 100vh;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  /* ============ 页头 ============ */
  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .page-head h1 { font-size: 24px; color: #1f2d3d; letter-spacing: 1px; }
  .page-head h1::after {
    content: "fetch";
    display: inline-block;
    margin-left: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: #4a7ee8;
    color: #fff;
    font-size: 12px;
    letter-spacing: 0;
    vertical-align: middle;
  }
  .page-head .author { font-size: 14px; color: #8795a5; }

  /* ============ 布局 ============ */
  .grid2 {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 18px;
  }
  @media (max-width: 860px) {
    .grid2 { grid-template-columns: 1fr; }
  }

  .panel {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(30, 45, 60, .07);
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    height: 46px;
    padding: 0 16px;
    border-bottom: 1px solid #eef0f3;
    background: #fafbfc;
  }
  .panel-head .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ff5f57; margin-right: 6px;
  }
  .panel-head .dot:nth-child(2) { background: #febc2e; }
  .panel-head .dot:nth-child(3) { background: #28c840; margin-right: 14px; }
  .panel-head .title { font-size: 14px; font-weight: bold; color: #34495e; }
  .panel-head .tools { margin-left: auto; }

  /* ============ 图片区 ============ */
  .pic-box {
    position: relative;
    height: 420px;
    background: #f7f9fb;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .pic-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    animation: fadeIn .35s ease;
  }
  .pic-box img.show { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(.96); }
    to { opacity: 1; transform: scale(1); }
  }
  .pic-loading {
    text-align: center;
    color: #8795a5;
    font-size: 14px;
  }
  .spinner {
    width: 34px; height: 34px;
    margin: 0 auto 12px;
    border: 3px solid #e6ebf1;
    border-top-color: #4a7ee8;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pic-error { display: none; text-align: center; color: #e34d4d; font-size: 14px; }
  .pic-error.show { display: block; }
  .pic-error p { margin-bottom: 12px; }

  /* ============ 操作区 ============ */
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid #eef0f3;
  }
  .btn {
    height: 36px;
    padding: 0 22px;
    border: 0;
    border-radius: 5px;
    background: #ff7a45;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #ff5c1f; }
  .btn:disabled {
    background: #f0b39c;
    cursor: not-allowed;
  }
  .api-url {
    margin-left: auto;
    font-size: 12px;
    color: #a6b1bd;
    font-family: Consolas, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============ JSON 代码区 ============ */
  .code-box {
    max-height: 250px;
    overflow: auto;
    padding: 14px 16px;
    background: #282c34;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 21px;
  }
  .code-box pre { color: #abb2bf; white-space: pre-wrap; word-break: break-all; }
  .k { color: #e06c75; }
  .s { color: #98c379; }
  .n { color: #d19a66; }
  .b { color: #c678dd; }
  .p { color: #abb2bf; }

  /* ============ 信息列表 ============ */
  .info {
    padding: 4px 16px 14px;
  }
  .info-row {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0f2f5;
    font-size: 13px;
  }
  .info-row:last-child { border-bottom: 0; }
  .info-row .label {
    width: 92px;
    flex: none;
    color: #8795a5;
  }
  .info-row .value {
    color: #1f2d3d;
    word-break: break-all;
  }
  .info-row .value.mono { font-family: Consolas, monospace; font-size: 12px; }
  .status-ok {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 10px;
    background: #e8f8ee;
    color: #1fa353;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="page-head">
    <h1>随机狗狗图片</h1>
    <span class="author">刘庭轩</span>
  </div>

  <div class="grid2">
    <!-- 左侧：图片 -->
    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="title">图片预览</span>
      </div>
      <div class="pic-box">
        <div class="pic-loading" id="loading">
          <div class="spinner"></div>
          正在请求接口…
        </div>
        <img id="dogImg" alt="随机狗狗图片">
        <div class="pic-error" id="error">
          <p id="errorText">请求失败，请稍后重试</p>
          <button class="btn" id="btnRetry">重新请求</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnFetch">换一只</button>
        <span class="api-url">GET dog.ceo/api/breeds/image/random</span>
      </div>
    </div>

    <!-- 右侧：接口返回数据 -->
    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="title">接口返回数据</span>
        <div class="tools"><span class="status-ok" id="statusBadge">status: -</span></div>
      </div>

      <div class="info">
        <div class="info-row">
          <span class="label">品种</span>
          <span class="value" id="breed">-</span>
        </div>
        <div class="info-row">
          <span class="label">图片地址</span>
          <span class="value mono" id="imgUrl">-</span>
        </div>
        <div class="info-row">
          <span class="label">请求耗时</span>
          <span class="value" id="cost">-</span>
        </div>
      </div>

      <div class="panel-head" style="border-top:1px solid #eef0f3;">
        <span class="title">原始 JSON</span>
      </div>
      <div class="code-box">
        <pre id="jsonView">等待请求…</pre>
      </div>
    </div>
  </div>

</div>

<script>
  var API = 'https://dog.ceo/api/breeds/image/random';

  var dogImg = document.getElementById('dogImg');
  var loading = document.getElementById('loading');
  var errorBox = document.getElementById('error');
  var errorText = document.getElementById('errorText');
  var btnFetch = document.getElementById('btnFetch');
  var btnRetry = document.getElementById('btnRetry');
  var jsonView = document.getElementById('jsonView');
  var breedEl = document.getElementById('breed');
  var imgUrlEl = document.getElementById('imgUrl');
  var costEl = document.getElementById('cost');
  var statusBadge = document.getElementById('statusBadge');

  /* ---------- JSON 语法着色 ---------- */
  function highlight(text) {
    var safe = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    return safe.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?|[{}\[\],:])/g,
      function (m) {
        var cls = 'n';
        if (/^"/.test(m)) {
          cls = /:$/.test(m) ? 'k' : 's';
        } else if (/true|false|null/.test(m)) {
          cls = 'b';
        } else if (/^[{}\[\],:]$/.test(m)) {
          cls = 'p';
        }
        return '<span class="' + cls + '">' + m + '</span>';
      }
    );
  }

  /* ---------- 从图片地址中解析品种 ---------- */
  // 地址格式：.../breeds/tennessee-eagle-hound/n02094433_1234.jpg
  function getBreed(url) {
    var m = url.match(/\/breeds\/([^\/]+)\//);
    if (!m) return '未知';

    return m[1]
      .split('-')
      .map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); })
      .join(' ');
  }

  /* ---------- 状态切换 ---------- */
  function showLoading() {
    loading.style.display = 'block';
    dogImg.classList.remove('show');
    errorBox.classList.remove('show');
    btnFetch.disabled = true;
    jsonView.textContent = '请求中…';
  }

  function showError(msg) {
    loading.style.display = 'none';
    dogImg.classList.remove('show');
    errorBox.classList.add('show');
    errorText.textContent = msg;
    btnFetch.disabled = false;
  }

  /* ---------- 加载图片 ---------- */
  function loadImage(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(url); };
      img.onerror = function () { reject(new Error('图片加载失败')); };
      img.src = url;
    });
  }

  /* ---------- 核心：用 fetch 获取数据 ---------- */
  function fetchDog() {
    showLoading();
    var start = Date.now();

    fetch(API)
      .then(function (res) {
        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }
        return res.json();   // 把响应体解析为 JSON 对象
      })
      .then(function (data) {
        jsonView.innerHTML = highlight(JSON.stringify(data, null, 2));
        statusBadge.textContent = 'status: ' + data.status;

        if (data.status !== 'success') {
          throw new Error('接口返回状态：' + data.status);
        }

        breedEl.textContent = getBreed(data.message);
        imgUrlEl.textContent = data.message;
        return loadImage(data.message);
      })
      .then(function (url) {
        dogImg.src = url;
        dogImg.classList.add('show');
        loading.style.display = 'none';
        costEl.textContent = (Date.now() - start) + ' ms';
        btnFetch.disabled = false;
        console.log('接口返回：', url);
      })
      .catch(function (err) {
        console.error('请求出错：', err);
        statusBadge.textContent = 'status: error';
        showError('请求失败：' + err.message);
        costEl.textContent = '-';
      });
  }

  /* ---------- 绑定事件 ---------- */
  btnFetch.addEventListener('click', fetchDog);
  btnRetry.addEventListener('click', fetchDog);

  /* ---------- 页面打开自动请求一次 ---------- */
  fetchDog();
</script>
</body>
</html>
