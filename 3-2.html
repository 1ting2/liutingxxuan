<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1018 刘庭轩</title>
    <style>
        /* h2黑底白字 */
        h2{
            background-color: #000;
            color: #fff;
        }
        h3{
            color: #ffffff; /*选择器三个字白色*/
        }
        p{
            color: blueviolet;
        }
        #box{
            width: 500px;
            height: 500px;
            background-color: aquamarine;
        }
        .n1{
            color: red; /*孙*/
        }
        .n2{
            color: cadetblue; /*家*/
        }
        .n3{
            color: orange; /*政*/
        }
        /*新盒子，文字1001*/
        #box2{
            width: 300px;
            height: 200px;
            background-color: #ccc;
            margin-top:20px;
            line-height:200px;
            text-align:center;
            font-size:30px;
        }
    </style>
</head>
<body>
    <h2>层叠样式表CSS</h2>
    <div id="box">
        <h3>CSS选择器</h3>
        <span><span class="n1">刘</span><span class="n2">庭</span><span class="n3">轩</span></span>
        <p>CSS属性</p>
    </div>
    <!--新增盒子-->
    <div id="box2">1018</div>
</body>
</html>
