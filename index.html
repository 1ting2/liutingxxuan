<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1018 刘庭轩的《高级网页设计》课堂实践</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            line-height: 1.8;
        }

        /* ========== 头部区域 ========== */
        header {
            text-align: center;
            padding: 50px 20px 30px;
            background: linear-gradient(180deg, rgba(48, 43, 99, 0.9), transparent);
        }

        header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5), 0 0 40px rgba(100, 200, 255, 0.2);
            margin-bottom: 10px;
        }

        header .subtitle {
            font-size: 16px;
            color: #a0a0d0;
            letter-spacing: 2px;
        }

        header .divider {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #6c63ff, transparent);
            margin: 20px auto 0;
            border-radius: 2px;
        }

        /* ========== 主体内容 ========== */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        /* ========== 链接卡片区域 ========== */
        .section-title {
            font-size: 22px;
            color: #b8b8ff;
            margin-bottom: 20px;
            padding-left: 14px;
            border-left: 4px solid #6c63ff;
            letter-spacing: 1px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px 20px;
            text-decoration: none;
            color: #e0e0e0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #6c63ff, #48c6ef);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(108, 99, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.15);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card .card-icon {
            font-size: 32px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .card .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }

        .card .card-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.6;
        }

        .card .card-tag {
            display: inline-block;
            margin-top: 10px;
            padding: 2px 10px;
            font-size: 11px;
            border-radius: 20px;
            background: rgba(108, 99, 255, 0.2);
            color: #9d97ff;
            letter-spacing: 0.5px;
        }

        /* ========== 提示词区域 ========== */
        .prompt-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 28px 24px;
            margin-top: 10px;
        }

        .prompt-section .section-title {
            margin-bottom: 14px;
        }

        .prompt-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(108, 99, 255, 0.25);
            border-radius: 8px;
            padding: 20px;
            font-size: 14px;
            color: #c0c0e0;
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .prompt-box .label {
            color: #6c63ff;
            font-weight: 600;
        }

        /* ========== 页脚 ========== */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #666;
            font-size: 13px;
            letter-spacing: 1px;
        }

        footer span {
            color: #6c63ff;
        }

        /* ========== 装饰动画 ========== */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .float-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(108, 99, 255, 0.3);
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
        }

        .float-dot:nth-child(1) { top: 15%; left: 8%; animation-delay: 0s; }
        .float-dot:nth-child(2) { top: 40%; left: 92%; animation-delay: 1s; width: 8px; height: 8px; }
        .float-dot:nth-child(3) { top: 70%; left: 5%; animation-delay: 2s; }
        .float-dot:nth-child(4) { top: 85%; left: 88%; animation-delay: 0.5s; width: 5px; height: 5px; }
        .float-dot:nth-child(5) { top: 25%; left: 95%; animation-delay: 1.5s; width: 4px; height: 4px; }
        .float-dot:nth-child(6) { top: 60%; left: 3%; animation-delay: 2.5s; width: 7px; height: 7px; }
    </style>
</head>
<body>

    <!-- 装饰浮动点 -->
    <div class="float-dot"></div>
    <div class="float-dot"></div>
    <div class="float-dot"></div>
    <div class="float-dot"></div>
    <div class="float-dot"></div>
    <div class="float-dot"></div>

    <!-- 头部 -->
    <header>
        <h1>&#x1F4BB; 刘庭轩的《高级网页设计》课堂实践</h1>
        <p class="subtitle">Advanced Web Design &mdash; Class Practice Portfolio</p>
        <div class="divider"></div>
    </header>

    <!-- 主体 -->
    <main>

        <!-- 页面导航链接 -->

        <div class="card-grid" id="cardGrid"></div>

    <!-- 页脚 -->

            { href: '2-2.html',  title: '2-2 超链接与表格', desc: '超链接、图片标签、相对路径与绝对路径，大国重器表格展示', icon: '\u{1F310}', tag: 'HTML 进阶' },
            { href: '3-1.html',  title: '3-1 表单Form', desc: '文本输入、密码、单选、复选、下拉选择、文本域、日期、文件上传与按钮', icon: '\u{1F4DD}', tag: '表单' },
            { href: '3-2.html',  title: '3-2 CSS层叠样式表', desc: 'CSS选择器：标签选择器、ID选择器、类选择器，CSS属性与样式应用', icon: '\u{1F3A8}', tag: 'CSS 基础' },
            { href: '4-1.html',  title: '4-1 CSS群组与后代选择器', desc: 'CSS群组选择器、后代选择器的综合运用，盒模型与排版美化', icon: '\u2728', tag: 'CSS 进阶' },
            { href: '6-1.html',  title: '6-1 Flex布局', desc: '使用Flex弹性布局实现灵活的页面排版与元素对齐', icon: '\u{1F4CF}', tag: 'Flex布局' },

            { href: '15-1.html', title: '15-1 数7游戏', desc: '循环+条件：1-100 中 7 的倍数或个位是 7 显示为空盒子', icon: '\u{1F3B2}', tag: 'JavaScript 条件循环' },
            { href: '16-1.html', title: '16-1 数组方法', desc: '22 个常用数组方法交互演示：push/pop/splice/map/filter/reduce 等', icon: '\u{1F522}', tag: 'JavaScript 数组' },
            { href: '16-2.html', title: '16-2 对象与字符串', desc: '对象属性操作与 18 个字符串常用方法的可视化演示', icon: '\u{1F4E6}', tag: 'JavaScript 对象' },
            { href: '16-3.html', title: '16-3 商品分类侧栏', desc: '仿京东分类菜单：图标字体 + 悬停高亮 + 右侧箭头效果', icon: '\u{1F4CB}', tag: '页面仿写' },
            { href: '16-4.html', title: '16-4 音乐手机选项卡', desc: '仿新闻卡片：Tab 标签页切换 + 新闻列表 + 日期对齐', icon: '\u{1F3B5}', tag: '页面仿写' }
        ];

        var grid = document.getElementById('cardGrid');
        pages.forEach(function (p) {
            var a = document.createElement('a');
            a.className = 'card';
            a.href = './' + p.href;
            a.innerHTML =
                '<span class="card-icon">' + p.icon + '</span>' +
                '<div class="card-title">' + p.title + '</div>' +
                '<div class="card-desc">' + p.desc + '</div>' +
                '<span class="card-tag">' + p.tag + '</span>';
            grid.appendChild(a);
        });
    </script>

</body>
