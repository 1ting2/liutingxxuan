<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>商品分类 - 刘庭轩</title>
<link rel="stylesheet" href="font/iconfont.css">
<style>
  body {
    font-family: "微软雅黑", sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
  }
  .sidebar {
    width: 320px;
    background: #ffffff;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    padding: 14px 0 8px;
  }
  .title {
    font-size: 18px;
    font-weight: bold;
    color: #222;
    padding: 0 16px 10px;
  }
  .item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    transition: background .15s;
  }
  .item .ic {
    font-size: 19px;
    color: #555;
    margin-right: 10px;
    transition: color .15s;
  }
  .item .arrow {
    display: none;
    margin-left: auto;
    font-size: 14px;
    color: #e1251b;
  }
  .item:hover {
    background: #fff0f0;
    color: #e1251b;
  }
  .item:hover .ic {
    color: #e1251b;
  }
  .item:hover .arrow {
    display: inline;
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="title">分类</div>
  <div id="list"></div>
</div>

<script>
  // 分类文字 + font 目录中挑选的图标
  var items = [
    { text: '冰洗 / 空调 / 电视 / 厨卫大电', icon: 'icon-fuwuzhongxin' },
    { text: '电脑 / 办公 / 文具用品', icon: 'icon-jiaochengziliao' },
    { text: '手机 / 运营商 / 数码', icon: 'icon-daishenhe' },
    { text: '生活电器 / 厨房小电 / 个护健康', icon: 'icon-gonglvezhinan' },
    { text: '食品 / 酒类 / 生鲜 / 特产', icon: 'icon-hongbao' },
    { text: '美妆 / 个护清洁 / 宠物', icon: 'icon-pinpaibiaoqian' },
    { text: '元器件 / 劳保物资 / 五金机电', icon: 'icon-gerenshezhi' },
    { text: '家装 / 建材 / 家具', icon: 'icon-renzheng' },
    { text: '家居日用 / 厨具', icon: 'icon-gengduo' },
    { text: '男鞋 / 运动 / 户外', icon: 'icon-redianhuodong' },
    { text: '男装 / 女装 / 童装 / 内衣', icon: 'icon-huiyuanVIP' }
  ];

  var list = document.getElementById('list');
  items.forEach(function (it) {
    var div = document.createElement('div');
    div.className = 'item';
    div.innerHTML =
      '<i class="iconfont ' + it.icon + ' ic"></i>' +
      '<span>' + it.text + '</span>' +
      '<span class="arrow">›</span>';
    list.appendChild(div);
  });
</script>
</body>
</html>
