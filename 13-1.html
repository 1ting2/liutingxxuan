<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Awesome 字体图标</title>
    <link rel="stylesheet" href="cdn/fa.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .icon-card {
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .icon-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .icon-card i {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }
        .icon-card .icon-name {
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }
        .fa-solid { color: #667eea; }
        .fa-regular { color: #764ba2; }
        .fa-brands { color: #f093fb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Font Awesome 字体图标</h1>
        <div class="icon-grid">
            <div class="icon-card">
                <i class="fas fa-home"></i>
                <span class="icon-name">首页</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-user"></i>
                <span class="icon-name">用户</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-heart"></i>
                <span class="icon-name">喜欢</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-star"></i>
                <span class="icon-name">收藏</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-cog"></i>
                <span class="icon-name">设置</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-search"></i>
                <span class="icon-name">搜索</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-envelope"></i>
                <span class="icon-name">邮件</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-bell"></i>
                <span class="icon-name">通知</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-camera"></i>
                <span class="icon-name">相机</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-music"></i>
                <span class="icon-name">音乐</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-cloud"></i>
                <span class="icon-name">云</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-fire"></i>
                <span class="icon-name">火</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-heartbeat"></i>
                <span class="icon-name">健康</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-book"></i>
                <span class="icon-name">书籍</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-car"></i>
                <span class="icon-name">汽车</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-plane"></i>
                <span class="icon-name">飞机</span>
            </div>
            <div class="icon-card">
                <i class="fab fa-github"></i>
                <span class="icon-name">GitHub</span>
            </div>
            <div class="icon-card">
                <i class="fab fa-weixin"></i>
                <span class="icon-name">微信</span>
            </div>
            <div class="icon-card">
                <i class="fab fa-weibo"></i>
                <span class="icon-name">微博</span>
            </div>
            <div class="icon-card">
                <i class="fab fa-qq"></i>
                <span class="icon-name">QQ</span>
            </div>
            <div class="icon-card">
                <i class="fab fa-android"></i>
                <span class="icon-name">安卓</span>
            </div>
            <div class="icon-card">
                <i class="fab fa-apple"></i>
                <span class="icon-name">苹果</span>
            </div>
            <div class="icon-card">
                <i class="fab fa-windows"></i>
                <span class="icon-name">Windows</span>
            </div>
            <div class="icon-card">
                <i class="fab fa-linux"></i>
                <span class="icon-name">Linux</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-regular fa-thumbs-up"></i>
                <span class="icon-name">点赞</span>
            </div>
            <div class="icon-card">
                <i class="fas fa-regular fa-bookmark"></i>
                <span class="icon-name">书签</span>
            </div>
        </div>
    </div>
</body>
</html>
