<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>淘宝热卖商品 - 刘庭轩</title>
<link rel="stylesheet" href="font/iconfont.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
    background: #fff;
  }
  .page { width: 1200px; margin: 0 auto; }

  /* ============ 顶部渐变区（活动条 + 图标导航） ============ */
  .top {
    background: linear-gradient(180deg,
      #ff073b 0%, #ff2e5a 14%, #fe597a 29%, #ff829a 43%,
      #feaab9 57%, #ffc8d2 71%, #fed6df 79%, #ffe1e7 86%,
      #ffeeef 93%, #ffffff 100%);
    padding: 6px 0 0;
  }
  .top-inner { width: 1200px; margin: 0 auto; }
  .banner-row {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .banner-row .promo-logo {
    height: 49px;
    margin: 2px 10px 0 0;
  }
  .banner-text {
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    letter-spacing: .5px;
    text-shadow: 0 1px 2px rgba(190, 0, 40, .25);
  }
  .banner-btn {
    margin-left: 14px;
    height: 26px;
    padding: 0 14px;
    border: 0;
    border-radius: 13px;
    background: #fff;
    color: #ff2d55;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }

  .nav {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 24px;
    padding: 4px 0 8px;
  }
  .nav-item { text-align: center; }
  .nav-item .ico {
    display: block;
    width: 36px;
    height: 36px;
    margin: 0 auto 5px;
    border-radius: 9px;
    color: #fff;
    font-size: 20px;
    line-height: 36px;
    text-align: center;
  }
  .nav-item .thumb {
    display: block;
    width: 36px;
    height: 36px;
    margin: 0 auto 5px;
    border-radius: 9px;
    background: #fff;
    object-fit: cover;
  }
  .nav-item span {
    display: block;
    font-size: 11px;
    color: #666;
    line-height: 1;
    white-space: nowrap;
  }
  .nav-item.c1 .ico { background: #37c978; }
  .nav-item.c2 .ico { background: #ff2d55; }
  .nav-item.c3 .ico { background: #ff8c00; }
  .nav-item.c4 .ico { background: #e62530; }
  .nav-item.c5 .ico { background: #e63023; }
  .nav-item.c6 .ico { background: #ff4a22; }
  .nav-hot {
    align-self: center;
    font-size: 17px;
    font-weight: bold;
    color: #ff0036;
    line-height: 1;
    white-space: nowrap;
  }

  /* ============ 头部：logo + 搜索框 ============ */
  .header {
    width: 1200px;
    margin: 0 auto;
    height: 67px;
    display: flex;
    align-items: center;
  }
  .logo {
    color: #ff5000;
    font-size: 40px;
    font-weight: bold;
    line-height: 1;
    letter-spacing: -1px;
    text-shadow: 0 1px 0 #fff;
  }
  .logo-sub {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    font-weight: normal;
    color: #ff5000;
    letter-spacing: .5px;
    text-shadow: none;
  }
  .logo-divider {
    width: 1px;
    height: 36px;
    background: #f5c7ae;
    margin: 0 12px;
  }
  .logo-title {
    font-size: 15px;
    font-weight: bold;
    color: #ff5000;
    line-height: 1.15;
  }
  .search {
    flex: 1;
    margin-left: 18px;
    height: 33px;
    display: flex;
    align-items: center;
    border: 2px solid #ff5000;
    border-radius: 17px;
    background: #fff;
    padding: 0 3px;
  }
  .search-cat {
    font-size: 12px;
    color: #333;
    padding: 0 12px;
    border-right: 1px solid #f0f0f0;
    line-height: 16px;
    white-space: nowrap;
    cursor: pointer;
  }
  .search-input {
    flex: 1;
    height: 100%;
    border: 0;
    outline: none;
    padding: 0 12px;
    font-size: 13px;
    color: #333;
    background: transparent;
  }
  .search-btn {
    width: 64px;
    height: 26px;
    border: 0;
    border-radius: 13px;
    background: #ff5000;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }

  /* ============ 主体 ============ */
  .main {
    width: 1200px;
    margin: 0 auto 13px;
    height: 299px;
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  /* 左侧分类 */
  .side {
    width: 191px;
    flex-shrink: 0;
    background: #f7f7f7;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .side h3 {
    font-size: 14px;
    font-weight: bold;
    color: #222;
    line-height: 20px;
    margin-bottom: 6px;
  }
  .cat-row {
    display: flex;
    align-items: center;
    height: 25px;
    font-size: 11px;
    color: #333;
    white-space: nowrap;
    cursor: pointer;
  }
  .cat-row:hover { color: #ff5000; }
  .cat-row svg {
    width: 13px;
    height: 13px;
    margin-right: 6px;
    flex-shrink: 0;
    stroke: #444;
    fill: none;
    stroke-width: 1.2;
  }
  .cat-row:hover svg { stroke: #ff5000; }
  .cat-row .sep { margin: 0 5px; color: #333; }
  .cat-row.hot { color: #ff4d00; }
  .cat-row.hot svg { stroke: #ff4d00; }
  .cat-row.hot .sep { color: #ff4d00; }

  /* 中间 banner */
  .carousel {
    flex: 1;
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: #7da665;
    color: #fff;
  }
  .carousel .bg {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: auto;
  }
  .carousel .txt {
    position: absolute;
    left: 27px;
    top: 62px;
    z-index: 2;
  }
  .carousel h2 {
    font-size: 26px;
    font-weight: bold;
    line-height: 1.18;
  }
  .carousel p {
    margin-top: 13px;
    font-size: 12px;
  }
  .dots {
    position: absolute;
    left: 26px;
    bottom: 11px;
    display: flex;
    gap: 6px;
    z-index: 2;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, .45);
  }
  .dots span.on { background: #fff; }

  /* 右侧促销卡 */
  .promos {
    width: 191px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .promo {
    flex: 1;
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
  }
  .promo .txt {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    line-height: 1.35;
    white-space: nowrap;
    z-index: 2;
  }
  .promo img {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    height: 58px;
    width: auto;
  }
  .promo.p1 { background: #ff622c; }
  .promo.p2 { background: #ff5f9c; }
  .promo.p3 { background: #fa8d1f; }
  .promo.p4 { background: #2690e3; }
</style>
</head>
<body>

<!-- 顶部渐变区 -->
<div class="top">
  <div class="top-inner">

    <div class="banner-row">
      <img class="promo-logo" src="img/top-logo.png" alt="淘宝双11">
      <div class="banner-text">天猫双11火热开启，专属福利限时领，好物低价别错过</div>
      <button class="banner-btn">去逛逛</button>
    </div>

    <div class="nav">
      <div class="nav-item c1"><i class="iconfont icon-hongbao ico"></i><span>国家补贴</span></div>
      <div class="nav-item c2"><i class="iconfont icon-redianhuodong ico"></i><span>淘宝秒杀</span></div>
      <div class="nav-item c3"><i class="iconfont icon-huodongyouli ico"></i><span>U先试用</span></div>
      <div class="nav-item"><img class="thumb" src="img/nav-1.png" alt="家电"></div>
      <div class="nav-item"><img class="thumb" src="img/nav-2.png" alt="母婴"></div>
      <div class="nav-hot">百亿补贴来啦</div>
      <div class="nav-item"><img class="thumb" src="img/nav-3.png" alt="好物"></div>
      <div class="nav-item"><img class="thumb" src="img/nav-4.png" alt="好物"></div>
      <div class="nav-item c4"><i class="iconfont icon-wodejifen ico"></i><span>领券中心</span></div>
      <div class="nav-item c5"><i class="iconfont icon-pinpaibiaoqian ico"></i><span>百亿补贴</span></div>
      <div class="nav-item c6"><i class="iconfont icon-chongzhiyouhui ico"></i><span>聚划算</span></div>
    </div>

  </div>
</div>

<div class="page">

  <!-- 头部：logo + 搜索 -->
  <div class="header">
    <div>
      <div class="logo">淘宝</div>
      <span class="logo-sub">Taobao.com</span>
    </div>
    <div class="logo-divider"></div>
    <div class="logo-title">热卖<br>商品</div>
    <div class="search">
      <div class="search-cat">宝贝 <span style="font-size:9px;color:#999;">▼</span></div>
      <input class="search-input" type="text">
      <button class="search-btn">搜索</button>
    </div>
  </div>

  <!-- 主体 -->
  <div class="main">

    <!-- 左：分类 -->
    <div class="side">
      <h3>分类</h3>

      <div class="cat-row hot">
        <svg viewBox="0 0 16 16"><path d="M8 1.6c1.9 2.6 1 3.9.5 4.7-.5 1 .3 1.8 1 1.2.9-.8 1-2.1 1-2.1 1.7 1.3 2.5 2.8 2.5 4.4A4.6 4.6 0 0 1 8 14.3 4.6 4.6 0 0 1 3.4 7.9c0-2.8 2.2-4.6 4.6-6.3z"/></svg>
        <span>叠券低至7.2折起</span><span class="sep">/</span><span>爆款8.5折起</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><rect x="1.6" y="3" width="12.8" height="9" rx="1"/><path d="M6 14h4M8 12v2"/></svg>
        <span>电脑</span><span class="sep">/</span><span>配件</span><span class="sep">/</span><span>办公</span><span class="sep">/</span><span>文具</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><rect x="5" y="1.6" width="6" height="12.8" rx="1.2"/><path d="M7.7 12.2h.6"/></svg>
        <span>家电</span><span class="sep">/</span><span>手机</span><span class="sep">/</span><span>通信</span><span class="sep">/</span><span>数码</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.2"/></svg>
        <span>工业品</span><span class="sep">/</span><span>商业</span><span class="sep">/</span><span>农业</span><span class="sep">/</span><span>定制</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><path d="M3 6h10l1 8H2z"/><path d="M5.6 6V4.4a2.4 2.4 0 0 1 4.8 0V6"/></svg>
        <span>家具</span><span class="sep">/</span><span>家装</span><span class="sep">/</span><span>家居</span><span class="sep">/</span><span>厨具</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><path d="M6.2 2 3.6 3.4 2 6.6l2 1.4.6-1.6V14h6.8V6.4l.6 1.6 2-1.4-1.6-3.2L9.8 2c0 1-.8 1.5-1.8 1.5s-1.8-.5-1.8-1.5z"/></svg>
        <span>女装</span><span class="sep">/</span><span>男装</span><span class="sep">/</span><span>内衣</span><span class="sep">/</span><span>配饰</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><path d="M2 10.6h9.4c1 0 1.9.4 2.4 1.2l.9 1.2H2z"/><path d="M4.6 10.6V8"/></svg>
        <span>女鞋</span><span class="sep">/</span><span>男鞋</span><span class="sep">/</span><span>运动</span><span class="sep">/</span><span>户外</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><path d="M2 10.4h12l-.4-2.6-1.4-2H4l-1.6 2z"/><circle cx="5" cy="11.6" r="1"/><circle cx="11" cy="11.6" r="1"/></svg>
        <span>汽车</span><span class="sep">/</span><span>珠宝</span><span class="sep">/</span><span>文玩</span><span class="sep">/</span><span>箱包</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.4c1.2-1.3 2.6-1 3.6.2.4.5 1.4.5 2-.4"/></svg>
        <span>食品</span><span class="sep">/</span><span>鲜花</span><span class="sep">/</span><span>酒水</span><span class="sep">/</span><span>健康</span>
      </div>

      <div class="cat-row">
        <svg viewBox="0 0 16 16"><path d="M6.8 1.6h2.4v1.8H6.8z"/><path d="M5.8 3.6h4.4v2.2c0 .9.5 1.3 1 2.2.4.7.4 1 .4 1.7v3.2c0 .9-.6 1.5-1.5 1.5h-4.2c-.9 0-1.5-.6-1.5-1.5v-3.2c0-.7 0-1 .4-1.7.5-.9 1-1.3 1-2.2V3.6z"/></svg>
        <span>母婴</span><span class="sep">/</span><span>童装</span><span class="sep">/</span><span>玩具</span><span class="sep">/</span><span>宠物</span>
      </div>
    </div>

    <!-- 中：banner -->
    <div class="carousel">
      <img class="bg" src="img/banner-right.png" alt="夏季上新">
      <div class="txt">
        <h2>夏季上新<br>解锁潮流穿搭</h2>
        <p>当季爆款 一键焕新</p>
      </div>
      <div class="dots">
        <span class="on"></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <!-- 右：促销卡 -->
    <div class="promos">
      <div class="promo p1">
        <div class="txt">品质家居<br>超值优惠</div>
        <img src="img/promo-1.png" alt="品质家居">
      </div>
      <div class="promo p2">
        <div class="txt">精致美妆<br>品质之选</div>
        <img src="img/promo-2.png" alt="精致美妆">
      </div>
      <div class="promo p3">
        <div class="txt">品质五金<br>超值特惠</div>
        <img src="img/promo-3.png" alt="品质五金">
      </div>
      <div class="promo p4">
        <div class="txt">超值百货<br>省钱省心</div>
        <img src="img/promo-4.png" alt="超值百货">
      </div>
    </div>

  </div>
</div>

</body>
</html>
