<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>淘宝热卖商品 - 刘庭轩</title>
<link rel="stylesheet" href="font/iconfont.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
    background: #f4f4f4;
    padding: 0 0 30px;
  }
  a { text-decoration: none; }
  .page {
    width: 1080px;
    margin: 0 auto;
    background: #fff;
  }

  /* ===== 顶部红色活动横幅 ===== */
  .top-banner {
    background: linear-gradient(90deg, #ff2d4d, #ff5e00, #ff2d4d);
    padding: 12px 0 6px;
    text-align: center;
  }
  .banner-inner {
    width: 1000px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .banner-box {
    width: 44px; height: 40px;
    border-radius: 6px;
    background: #fff;
    margin-right: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; color: #ff4400;
    line-height: 1;
  }
  .banner-text {
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .banner-btn {
    background: #fff;
    color: #ff4400;
    font-size: 14px;
    font-weight: bold;
    padding: 5px 14px;
    border-radius: 20px;
    margin-left: 14px;
    border: 1px solid #fff;
    cursor: pointer;
  }

  /* ===== 顶部图标导航 ===== */
  .icon-nav {
    width: 1000px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0 14px;
  }
  .nav-item {
    width: 64px;
    text-align: center;
    font-size: 12px;
    color: #666;
    cursor: pointer;
  }
  .nav-item i {
    font-size: 22px;
    display: block;
    width: 40px; height: 40px;
    line-height: 40px;
    text-align: center;
    border-radius: 10px;
    margin: 0 auto 4px;
    color: #fff;
  }
  .nav-item .nav-img {
    width: 44px; height: 44px;
    border-radius: 10px;
    object-fit: cover;
    display: block;
    margin: 0 auto 4px;
  }
  .nav-item.c1 i { background: #3cb371; }
  .nav-item.c2 i { background: #ff3b30; }
  .nav-item.c3 i { background: #ff8c00; }
  .nav-item.c4 i { background: #9b1fd6; }
  .nav-item.c5 i { background: #d0021b; }
  .nav-item.c6 i { background: #f5222d; }
  .nav-item.c7 i { background: #e6153a; }
  .nav-item.hot-word {
    width: auto;
    font-size: 18px;
    font-weight: bold;
    color: #222;
    line-height: 30px;
  }

  /* ===== 头部：logo + 搜索框 ===== */
  .header {
    width: 1000px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    padding: 12px 0 14px;
  }
  .logo {
    color: #ff5000;
    font-size: 40px;
    font-weight: bold;
    font-style: italic;
    line-height: 1;
    white-space: nowrap;
  }
  .logo-sub {
    font-size: 12px;
    color: #999;
    font-style: normal;
    display: block;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .logo-title {
    margin-left: 14px;
    border-left: 1px solid #ddd;
    padding-left: 14px;
    font-size: 20px;
    font-weight: bold;
    color: #333;
    line-height: 1.2;
  }
  .search-box {
    flex: 1;
    margin-left: 40px;
    display: flex;
    border: 2px solid #ff5000;
    border-radius: 20px;
    overflow: hidden;
    background: #fff;
    height: 36px;
  }
  .search-cat {
    width: 70px;
    text-align: center;
    line-height: 32px;
    font-size: 14px;
    color: #333;
    border-right: 1px solid #eee;
    cursor: pointer;
  }
  .search-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 0 14px;
    font-size: 14px;
    color: #333;
  }
  .search-btn {
    width: 90px;
    background: #ff5000;
    color: #fff;
    border: none;
    font-size: 16px;
    cursor: pointer;
  }

  /* ===== 主体区域 ===== */
  .main {
    width: 1000px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    padding-bottom: 20px;
  }

  /* 左侧分类 */
  .side {
    width: 180px;
    flex-shrink: 0;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 12px 10px;
  }
  .side h3 {
    font-size: 15px;
    color: #333;
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .cat-row {
    display: flex;
    align-items: center;
    font-size: 12px;
    color: #666;
    padding: 6px 4px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cat-row:hover { background: #fff3ef; color: #ff5000; }
  .cat-row i {
    font-size: 16px;
    color: #999;
    margin-right: 8px;
  }
  .cat-row:hover i { color: #ff5000; }
  .cat-row.hot { color: #ff4400; }
  .cat-row.hot i { color: #ff4400; }
  .cat-row span + span::before {
    content: "/";
    margin: 0 4px;
    color: #ccc;
  }

  /* 中间轮播大图 */
  .carousel {
    flex: 1;
    background: linear-gradient(135deg, #8fbf4e 0%, #6ba33a 100%);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    color: #fff;
    height: 360px;
  }
  .carousel-text {
    position: absolute;
    left: 36px;
    top: 70px;
    z-index: 2;
  }
  .carousel-text h2 {
    font-size: 38px;
    font-weight: bold;
    line-height: 1.3;
  }
  .carousel-text p {
    margin-top: 14px;
    font-size: 14px;
    opacity: .95;
  }
  .carousel-text p b { font-size: 16px; }

  /* 服装图片 */
  .clothes {
    position: absolute;
    right: 40px;
    top: 30px;
    width: 380px;
    height: 300px;
  }
  .clothes img {
    position: absolute;
    object-fit: contain;
    mix-blend-mode: multiply;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,.15));
  }
  .clothes .shirt {
    left: 40px;
    bottom: 10px;
    height: 260px;
  }
  .clothes .hat {
    right: 10px;
    top: 0;
    height: 110px;
  }
  .clothes .skirt {
    right: 20px;
    bottom: 0;
    height: 220px;
  }
  .dots {
    position: absolute;
    left: 36px;
    bottom: 16px;
    display: flex;
    gap: 8px;
  }
  .dots span {
    width: 8px; height: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,.5);
  }
  .dots span.on { background: #fff; }

  /* 右侧推广卡片 */
  .promos {
    width: 176px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .promo {
    flex: 1;
    border-radius: 6px;
    color: #fff;
    padding: 12px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .promo .txt {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.6;
    white-space: nowrap;
  }
  .promo .badge {
    width: 56px; height: 56px;
    background: rgba(255,255,255,.85);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 6px;
    overflow: hidden;
  }
  .promo .badge img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .promo.p1 { background: linear-gradient(135deg, #ff7a2f, #ff5000); }
  .promo.p2 { background: linear-gradient(135deg, #f7a8c4, #e85a8a); }
  .promo.p3 { background: linear-gradient(135deg, #ff7a2f, #ff5000); }
  .promo.p4 { background: linear-gradient(135deg, #4fc3f7, #1976d2); }
</style>
</head>
<body>

<div class="page">

  <!-- 顶部红色活动横幅 -->
  <div class="top-banner">
    <div class="banner-inner">
      <div class="banner-box">淘</div>
      <div class="banner-text">天猫双11火热开启，专属福利限时领，好物低价别错过</div>
      <button class="banner-btn">去逛逛</button>
    </div>

    <!-- 顶部图标导航 -->
    <div class="icon-nav">
      <div class="nav-item c1"><i class="iconfont icon-hongbao"></i>国家补贴</div>
      <div class="nav-item c2"><i class="iconfont icon-redianhuodong"></i>淘宝秒杀</div>
      <div class="nav-item c3"><i class="iconfont icon-huodongyouli"></i>U先试用</div>
      <div class="nav-item"><img class="nav-img" src="https://picsum.photos/seed/stroller/100" alt="母婴">母婴</div>
      <div class="nav-item"><img class="nav-img" src="https://picsum.photos/seed/appliance/100" alt="家电">家电</div>
      <div class="nav-item hot-word">百亿补贴来啦</div>
      <div class="nav-item"><img class="nav-img" src="https://picsum.photos/seed/cosmetic/100" alt="美妆">美妆</div>
      <div class="nav-item"><img class="nav-img" src="https://picsum.photos/seed/phone/100" alt="数码">数码</div>
      <div class="nav-item c7"><i class="iconfont icon-wodejifen"></i>领券中心</div>
      <div class="nav-item c4"><i class="iconfont icon-pinpaibiaoqian"></i>百亿补贴</div>
      <div class="nav-item c1"><i class="iconfont icon-chongzhiyouhui"></i>聚划算</div>
    </div>
  </div>

  <!-- 头部：logo + 搜索框 -->
  <div class="header">
    <div class="logo">淘宝<span class="logo-sub">Taobao.com</span></div>
    <div class="logo-title">热卖商品</div>
    <div class="search-box">
      <div class="search-cat">宝贝</div>
      <input class="search-input" type="text">
      <button class="search-btn">搜索</button>
    </div>
  </div>

  <!-- 主体：左分类 + 中轮播 + 右推广 -->
  <div class="main">

    <!-- 左侧分类 -->
    <div class="side">
      <h3>分类</h3>
      <div class="cat-row hot"><i class="iconfont icon-redianhuodong"></i><span>叠券低至7.2折起</span><span>爆款8.5折起</span></div>
      <div class="cat-row"><i class="iconfont icon-fuwuzhongxin"></i><span>电脑</span><span>配件</span><span>办公</span><span>文具</span></div>
      <div class="cat-row"><i class="iconfont icon-lianxikefu"></i><span>家电</span><span>手机</span><span>通信</span><span>数码</span></div>
      <div class="cat-row"><i class="iconfont icon-renzheng"></i><span>工业品</span><span>商业</span><span>农业</span><span>定制</span></div>
      <div class="cat-row"><i class="iconfont icon-jiaochengziliao"></i><span>家具</span><span>家装</span><span>家居</span><span>厨具</span></div>
      <div class="cat-row"><i class="iconfont icon-huiyuanVIP"></i><span>女装</span><span>男装</span><span>内衣</span><span>配饰</span></div>
      <div class="cat-row"><i class="iconfont icon-peisong"></i><span>女鞋</span><span>男鞋</span><span>运动</span><span>户外</span></div>
      <div class="cat-row"><i class="iconfont icon-dingwei"></i><span>汽车</span><span>珠宝</span><span>文玩</span><span>箱包</span></div>
      <div class="cat-row"><i class="iconfont icon-chongzhiyouhui"></i><span>食品</span><span>鲜花</span><span>酒水</span><span>健康</span></div>
      <div class="cat-row"><i class="iconfont icon-gonglvezhinan"></i><span>母婴</span><span>童装</span><span>玩具</span><span>宠物</span></div>
    </div>

    <!-- 中间轮播大图 -->
    <div class="carousel">
      <div class="carousel-text">
        <h2>夏季上新<br>解锁潮流穿搭</h2>
        <p>当季爆款<b>一键焕新</b></p>
      </div>
      <div class="clothes">
        <img class="shirt" src="img/shirt.jpg" alt="衬衫">
        <img class="hat" src="img/hat.jpg" alt="帽子">
        <img class="skirt" src="img/skirt.jpg" alt="裙子">
      </div>
      <div class="dots">
        <span></span><span></span><span></span><span></span><span class="on" style="width:16px"></span><span></span>
      </div>
    </div>

    <!-- 右侧推广卡片 -->
    <div class="promos">
      <div class="promo p1">
        <div class="txt">品质家居<br>超值优惠</div>
        <div class="badge"><img src="https://picsum.photos/seed/sofa/120" alt="家居"></div>
      </div>
      <div class="promo p2">
        <div class="txt">精致美妆<br>品质之选</div>
        <div class="badge"><img src="https://picsum.photos/seed/cosmetics/120" alt="美妆"></div>
      </div>
      <div class="promo p3">
        <div class="txt">品质五金<br>超值特惠</div>
        <div class="badge"><img src="https://picsum.photos/seed/tools/120" alt="五金"></div>
      </div>
      <div class="promo p4">
        <div class="txt">超值百货<br>省钱省心</div>
        <div class="badge"><img src="https://picsum.photos/seed/daily/120" alt="百货"></div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
