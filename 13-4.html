<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG图标 - 底部导航</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: #f7f8fa;
            min-height: 100vh;
        }
        .page-content { padding: 120px 20px 80px; text-align: center; color: #999; }
        .page-content h2 { font-size: 18px; color: #333; margin-bottom: 8px; }
        .tab-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; width: 100%;
            background: #fff; border-top: 1px solid #ebedf0;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 6px 0 4px; color: #646566;
            text-decoration: none; position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-item:active { background: #f2f3f5; }
        .tab-item.active { color: #1989fa; }
        .tab-item svg { width: 24px; height: 24px; }
        .tab-item .tab-label { font-size: 10px; margin-top: 3px; }
        .tab-item .badge {
            position: absolute; top: 2px; right: calc(50% - 24px);
            background: #ee0a24; color: #fff; font-size: 10px;
            min-width: 16px; height: 16px; line-height: 16px;
            border-radius: 8px; text-align: center; padding: 0 4px;
        }
        .tab-item .red-dot {
            position: absolute; top: 6px; right: calc(50% - 18px);
            width: 8px; height: 8px; background: #ee0a24; border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="page-content">
        <h2>SVG图标底部导航</h2>
        <p>使用内联 SVG 图标实现</p>
    </div>
    <nav class="tab-bar" id="tabBar">
        <a href="javascript:;" class="tab-item active">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="tab-label">首页</span>
        </a>
        <a href="javascript:;" class="tab-item">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v2H4v14h16V6h-3V4h-2v2H9V4H7zm11 4v10H6V8h12z"/></svg>
            <span class="tab-label">团购</span>
            <span class="badge">8</span>
        </a>
        <a href="javascript:;" class="tab-item">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
            <span class="tab-label">消息</span>
            <span class="red-dot"></span>
        </a>
        <a href="javascript:;" class="tab-item">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="tab-label">我的</span>
            <span class="badge">3</span>
        </a>
    </nav>
    <script>
        document.querySelectorAll('#tabBar .tab-item').forEach(function (item) {
            item.addEventListener('click', function () {
                document.querySelectorAll('#tabBar .tab-item').forEach(function (i) { i.classList.remove('active'); });
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
